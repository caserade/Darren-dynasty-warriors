<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Character review</title>
    <style>
      html,
      body {
        margin: 0;
        background: #c9dbe6;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/" } }
    </script>
  </head>
  <body>
    <canvas id="c" width="640" height="640"></canvas>
    <script type="module">
      // Character review stage (Claude update 8): loads one hero with the game's own rig, clips and
      // animator, and poses it at any clip time and angle for turnaround and contact sheets.
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import * as ANIM from '/anim.mjs';
      const { buildRig, Animator, applyPose, mix } = ANIM;
      // Older builds have no keepClear (Claude update 12); the review still runs on them.
      const keepClear = ANIM.keepClear || (() => 0);
      import { LIBRARY } from '/clips.mjs';
      import { buildClips } from '/clips.mjs';
      import { addMetalShine } from '/look.mjs';
      import { MOVESETS } from '/moves.mjs';
      // Moves that hop (moves.mjs hop: { t, vy }) are in the air from the hop until they land
      // (sim.mjs gravity 18 m/s²); the game plants feet and keeps the body out of the ground
      // only on the ground, so the review does the same (Claude update 12).
      const HOPS = {};
      (function walk(o) {
        if (!o || typeof o !== 'object') return;
        if (o.anim && o.hop) HOPS[o.anim] = [o.hop.t, o.hop.t + (2 * o.hop.vy) / 18];
        Object.values(o).forEach(walk);
      })(MOVESETS);
      const inAir = (clip, t) =>
        /Jump|Fall/.test(clip) || (HOPS[clip] && t > HOPS[clip][0] && t < HOPS[clip][1]) ? 1 : 0;
      const q = new URLSearchParams(location.search);
      const name = q.get('hero') || 'Darren';
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.shadowMap.enabled = true;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xc9dbe6);
      scene.add(new THREE.HemisphereLight(0xe9f7ff, 0x747b66, 2.4));
      const sun = new THREE.DirectionalLight(0xffe6bd, 3.2);
      sun.position.set(4, 8, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.normalBias = 0.02;
      scene.add(sun);
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(3, 48),
        new THREE.MeshStandardMaterial({ color: 0xf3f8fb, roughness: 0.9 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
      const gltf = await new GLTFLoader().loadAsync(`/assets/${name.toLowerCase()}.glb`);
      const root = gltf.scene;
      scene.add(root);
      const meshes = [];
      root.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = o.receiveShadow = true;
          o.frustumCulled = false;
          meshes.push(o);
          o.userData.mat = o.material;
        }
      });
      // Same look as in the game (game.mjs gives Tormund the metal shine).
      if (name === 'Tormund') addMetalShine(root, renderer);
      const rig = buildRig(root, name);
      const authored = buildClips(rig);
      const names = new Set(authored.map((c) => c.name));
      const all = [...authored, ...gltf.animations.filter((c) => !names.has(c.name))];
      const animator = new Animator(root, rig, all, {});
      const clay = new THREE.MeshStandardMaterial({ color: 0xb8b2a8, roughness: 0.75 });
      const wire = new THREE.MeshBasicMaterial({ color: 0x223344, wireframe: true });
      const skel = new THREE.SkeletonHelper(root);
      skel.visible = false;
      scene.add(skel);
      // Colors each vertex by how much one named bone moves it (red = fully, blue = not at all).
      function weightMaterial(mesh, bone) {
        const g = mesh.geometry,
          j = g.attributes.skinIndex,
          w = g.attributes.skinWeight;
        const bi = mesh.skeleton.bones.findIndex((b) => b.name === bone);
        const col = new Float32Array(g.attributes.position.count * 3);
        for (let i = 0; i < g.attributes.position.count; i++) {
          let v = 0;
          for (let k = 0; k < 4; k++) if (j.getComponent(i, k) === bi) v += w.getComponent(i, k);
          col.set([v, 0.15 * (1 - v), 1 - v], i * 3);
        }
        setDebugColors(g, col);
        return new THREE.MeshBasicMaterial({ vertexColors: true });
      }
      // Colours every vertex by the bones that move it, mixed by weight (one colour per bone), so
      // the whole skin's ownership shows at once (Claude update 11).
      const BONE_COLORS = {};
      function boneColor(name) {
        if (!BONE_COLORS[name]) {
          const i = rig.bones.findIndex((b) => b.name === name);
          BONE_COLORS[name] = new THREE.Color().setHSL((((i * 0.381966) % 1) + 1) % 1, 0.75, 0.55);
        }
        return BONE_COLORS[name];
      }
      function ownersMaterial(mesh) {
        const g = mesh.geometry,
          j = g.attributes.skinIndex,
          w = g.attributes.skinWeight,
          col = new Float32Array(g.attributes.position.count * 3),
          c = new THREE.Color();
        for (let i = 0; i < g.attributes.position.count; i++) {
          c.setRGB(0, 0, 0);
          for (let k = 0; k < 4; k++) {
            const wt = w.getComponent(i, k);
            if (wt > 0)
              c.add(
                boneColor(mesh.skeleton.bones[j.getComponent(i, k)].name).clone().multiplyScalar(wt)
              );
          }
          col.set([c.r, c.g, c.b], i * 3);
        }
        setDebugColors(g, col);
        return new THREE.MeshBasicMaterial({ vertexColors: true });
      }
      // Weight on bones far from the vertex (more than `far` beyond its nearest bone): red = all of
      // its weight comes from a distant bone, grey = none (Claude update 11).
      function strayMaterial(mesh, far = 0.12) {
        const g = mesh.geometry,
          j = g.attributes.skinIndex,
          w = g.attributes.skinWeight,
          col = new Float32Array(g.attributes.position.count * 3),
          v = new THREE.Vector3();
        const segs = BIND_SEGS;
        for (let i = 0; i < g.attributes.position.count; i++) {
          v.fromArray(mesh.userData.rest, i * 3).applyMatrix4(mesh.matrixWorld);
          const d = Object.fromEntries(
            Object.entries(segs).map(([n, s]) => [n, segDistance(v, s)])
          );
          const near = Math.min(...Object.values(d));
          let stray = 0;
          for (let k = 0; k < 4; k++) {
            const n = mesh.skeleton.bones[j.getComponent(i, k)].name;
            if (d[n] > near + far) stray += w.getComponent(i, k);
          }
          const s = Math.min(1, stray * 2);
          col.set([0.78 + 0.22 * s, 0.78 * (1 - s), 0.78 * (1 - s)], i * 3);
        }
        setDebugColors(g, col);
        return new THREE.MeshBasicMaterial({ vertexColors: true });
      }
      let BIND_SEGS = null;
      // Each bone as a segment from its head to the middle of its children's heads (bind pose).
      function boneSegments() {
        const seg = {},
          all = [];
        root.traverse((o) => o.isBone && all.push(o));
        for (const bone of all) {
          const h = bone.getWorldPosition(new THREE.Vector3());
          const kids = bone.children.filter((c) => c.isBone);
          const t = kids.length
            ? kids
                .reduce(
                  (s, c) => s.add(c.getWorldPosition(new THREE.Vector3())),
                  new THREE.Vector3()
                )
                .divideScalar(kids.length)
            : h.clone();
          seg[bone.name] = [h, t];
        }
        return seg;
      }
      function segDistance(p, [h, t]) {
        const d = t.clone().sub(h),
          L = d.lengthSq();
        const u = L ? Math.max(0, Math.min(1, p.clone().sub(h).dot(d) / L)) : 0;
        return p.distanceTo(h.clone().addScaledVector(d, u));
      }
      // Debug views paint their own vertex colours; the model's own (baked shading) come back after.
      function setDebugColors(g, col) {
        if (!('ownColor' in g.userData)) g.userData.ownColor = g.attributes.color || null;
        g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      }
      function restoreColors() {
        for (const m of meshes) {
          const g = m.geometry;
          if (!('ownColor' in g.userData)) continue;
          if (g.userData.ownColor) g.setAttribute('color', g.userData.ownColor);
          else g.deleteAttribute('color');
          delete g.userData.ownColor;
        }
      }
      // Colours each vertex by how much the current pose stretches (red) or squashes (blue) the
      // edges around it; grey = unchanged. Called after the pose is set (see shot()).
      function stretchMaterial(m) {
        m.userData.stretchMat ??= new THREE.MeshBasicMaterial({ vertexColors: true });
        m.userData.needsStretch = true;
        return m.userData.stretchMat;
      }
      function paintStretch(m) {
        const g = m.geometry,
          pos = g.attributes.position,
          idx = g.index,
          n = pos.count,
          posed = [],
          a = new THREE.Vector3(),
          b = new THREE.Vector3(),
          worst = new Float32Array(n);
        for (let i = 0; i < n; i++) posed.push(m.getVertexPosition(i, new THREE.Vector3()));
        for (let t = 0; idx && t < idx.count; t += 3)
          for (let k = 0; k < 3; k++) {
            const p = idx.getX(t + k),
              q = idx.getX(t + ((k + 1) % 3));
            a.fromArray(m.userData.rest, p * 3);
            b.fromArray(m.userData.rest, q * 3);
            const rest = a.distanceTo(b);
            if (rest < 1e-5) continue;
            const l = Math.log(posed[p].distanceTo(posed[q]) / rest);
            for (const v of [p, q]) if (Math.abs(l) > Math.abs(worst[v])) worst[v] = l;
          }
        const col = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          const s = Math.min(1, Math.abs(worst[i]) / Math.log(1.8));
          col.set(
            worst[i] > 0
              ? [0.75 + 0.25 * s, 0.75 * (1 - s), 0.75 * (1 - s)]
              : [0.75 * (1 - s), 0.75 * (1 - s), 0.75 + 0.25 * s],
            i * 3
          );
        }
        setDebugColors(g, col);
      }
      // The painted colours with no lighting (albedo), or the metal map as grey (white = metal).
      function flatMaterial(m, mode) {
        const src = m.userData.mat,
          k = mode + 'Flat';
        if (!src[k]) {
          const map = mode === 'metal' ? src.metalnessMap : src.map;
          src[k] = new THREE.MeshBasicMaterial({ map, color: map ? 0xffffff : src.color });
          if (mode === 'metal' && map)
            src[k].onBeforeCompile = (sh) => {
              sh.fragmentShader = sh.fragmentShader.replace(
                '#include <map_fragment>',
                '#include <map_fragment>\n diffuseColor.rgb = vec3(texture2D(map, vMapUv).b);'
              );
            };
          if (mode === 'metal' && !map) src[k].color.setScalar(src.metalness);
        }
        return src[k];
      }
      window.review = {
        clips: all.map((c) => ({ name: c.name, dur: c.duration })),
        bones: rig.bones.map((b) => b.name),
        stats: () => {
          root.updateMatrixWorld(true);
          const box = new THREE.Box3();
          for (const m of meshes) {
            const p = m.geometry.attributes.position,
              v = new THREE.Vector3();
            for (let i = 0; i < p.count; i += 3) {
              m.getVertexPosition(i, v);
              m.localToWorld(v);
              box.expandByPoint(v);
            }
          }
          return { min: box.min.toArray(), max: box.max.toArray(), scale: root.scale.toArray() };
        },
        // Mesh stretch at one clip time (Claude update 9): every edge's posed length over its
        // rest length; returns, per bone that mostly drives the edge, the worst stretch and squash.
        stretch(o = {}) {
          this.shot({ ...o, mode: 'tex' });
          const out = {},
            a = new THREE.Vector3(),
            b = new THREE.Vector3();
          for (const m of meshes) {
            const g = m.geometry,
              pos = g.attributes.position,
              idx = g.index,
              j = g.attributes.skinIndex,
              w = g.attributes.skinWeight;
            if (!m.isSkinnedMesh || !idx) continue;
            const posed = new Float32Array(pos.count * 3);
            for (let i = 0; i < pos.count; i++) {
              m.getVertexPosition(i, a);
              posed.set(a.toArray(), i * 3);
            }
            const top = (i) => {
              let bi = 0;
              for (let k = 1; k < 4; k++) if (w.getComponent(i, k) > w.getComponent(i, bi)) bi = k;
              return m.skeleton.bones[j.getComponent(i, bi)].name;
            };
            for (let t = 0; t < idx.count; t += 3)
              for (let k = 0; k < 3; k++) {
                const p = idx.getX(t + k),
                  q = idx.getX(t + ((k + 1) % 3));
                a.fromArray(m.userData.rest, p * 3);
                b.fromArray(m.userData.rest, q * 3);
                const rest = a.distanceTo(b);
                if (rest < 0.006) continue; // ignore tiny edges, where any change looks huge
                a.fromArray(posed, p * 3);
                b.fromArray(posed, q * 3);
                const r = a.distanceTo(b) / rest,
                  name = top(p),
                  e = (out[name] ??= { max: 1, min: 1, bad: 0 });
                if (r > 1.6 || r < 0.5) e.bad++;
                e.max = Math.max(e.max, r);
                e.min = Math.min(e.min, r);
              }
          }
          return out;
        },
        // Skin-weight diagnosis (Claude update 11, tools/review/weights.cjs). Static checks on the
        // bind pose, then every clip sampled `samples` times: edges stretched past 1.6x or squashed
        // under 0.5x ("tears"), past 1.3x / under 0.77x ("strain"), per clip and per pair of bones
        // that drive the two ends, plus how much the closed body loses or gains volume.
        diagnose({ samples = 12, skip = [] } = {}) {
          const v = new THREE.Vector3(),
            a = new THREE.Vector3(),
            b = new THREE.Vector3();
          this.shot({ bind: true });
          const skinned = meshes.filter((m) => m.isSkinnedMesh && m.geometry.index);
          const boneName = (m, i) => m.skeleton.bones[i].name;
          const seg = BIND_SEGS,
            segDist = segDistance;
          const family = (n1, n2) => {
            const b1 = root.getObjectByName(n1),
              b2 = root.getObjectByName(n2);
            return n1 === n2 || b1?.parent === b2 || b2?.parent === b1 || b1?.parent === b2?.parent;
          };
          const statics = { far: {}, crossSide: {}, hardSeams: {}, influences: [0, 0, 0, 0, 0] };
          const tops = new Map();
          for (const m of skinned) {
            const g = m.geometry,
              j = g.attributes.skinIndex,
              w = g.attributes.skinWeight,
              n = g.attributes.position.count,
              top = new Array(n);
            m.updateMatrixWorld(true);
            for (let i = 0; i < n; i++) {
              let bi = 0,
                count = 0;
              for (let k = 0; k < 4; k++) {
                if (w.getComponent(i, k) > w.getComponent(i, bi)) bi = k;
                if (w.getComponent(i, k) > 0.01) count++;
              }
              statics.influences[count]++;
              top[i] = boneName(m, j.getComponent(i, bi));
              v.fromArray(m.userData.rest, i * 3).applyMatrix4(m.matrixWorld);
              const near = Math.min(...Object.values(seg).map((s) => segDist(v, s)));
              for (let k = 0; k < 4; k++) {
                const wt = w.getComponent(i, k);
                if (wt < 0.05) continue;
                const nm = boneName(m, j.getComponent(i, k));
                // An influence much farther away than the nearest bone, and not a neighbour of
                // the vertex's main bone: likely pulled by the wrong bone.
                if (segDist(v, seg[nm]) > near + 0.25 && !family(nm, top[i])) {
                  const e = (statics.far[m.name + ':' + nm + ' on ' + top[i]] ??= { n: 0, w: 0 });
                  e.n++;
                  e.w = Math.max(e.w, wt);
                }
                // Left-side skin moved by a right-side bone, or the other way round.
                const side = /_L$/.test(nm) ? 1 : /_R$/.test(nm) ? -1 : 0;
                if (side && v.x * side < -0.06) {
                  const e = (statics.crossSide[m.name + ':' + nm] ??= { n: 0, w: 0 });
                  e.n++;
                  e.w = Math.max(e.w, wt);
                }
              }
            }
            // Neighbouring vertices whose weights differ a lot: the skin creases there.
            const idx = g.index,
              wmap = (i) => {
                const o = {};
                for (let k = 0; k < 4; k++)
                  o[j.getComponent(i, k)] = (o[j.getComponent(i, k)] || 0) + w.getComponent(i, k);
                return o;
              };
            for (let t = 0; t < idx.count; t += 3)
              for (let k = 0; k < 3; k++) {
                const p = idx.getX(t + k),
                  q = idx.getX(t + ((k + 1) % 3));
                const mp = wmap(p),
                  mq = wmap(q);
                let jump = 0;
                for (const key of new Set([...Object.keys(mp), ...Object.keys(mq)]))
                  jump = Math.max(jump, Math.abs((mp[key] || 0) - (mq[key] || 0)));
                if (jump > 0.5) {
                  const key = m.name + ':' + [top[p], top[q]].sort().join('/');
                  statics.hardSeams[key] = (statics.hardSeams[key] || 0) + 1;
                }
              }
            tops.set(m, top);
          }
          for (const k of Object.keys(statics.hardSeams)) statics.hardSeams[k] /= 2; // edges are shared
          const restVol = {};
          const volume = (m, posed) => {
            const idx = m.geometry.index;
            let s = 0;
            for (let t = 0; t < idx.count; t += 3) {
              const p = idx.getX(t) * 3,
                q = idx.getX(t + 1) * 3,
                r = idx.getX(t + 2) * 3;
              a.set(posed[q] - posed[p], posed[q + 1] - posed[p + 1], posed[q + 2] - posed[p + 2]);
              b.set(posed[r] - posed[p], posed[r + 1] - posed[p + 1], posed[r + 2] - posed[p + 2]);
              a.cross(b);
              s += a.x * posed[p] + a.y * posed[p + 1] + a.z * posed[p + 2];
            }
            return s / 6;
          };
          for (const m of skinned) restVol[m.name] = volume(m, m.userData.rest);
          const clips = {},
            pairs = {},
            vertWorst = new Map(
              skinned.map((m) => [m, new Float32Array(m.geometry.attributes.position.count)])
            ),
            vertClip = new Map(
              skinned.map((m) => [m, new Array(m.geometry.attributes.position.count)])
            );
          // Scarf pieces against the body under them: each scarf vertex's nearest body vertex at
          // rest (below the chin); posed, the gap should stay about the same. "sunk" = gap under 40% of rest (it
          // dips into the body), "lifted" = gap grew by over 4 cm (it floats off).
          const body = skinned.find((m) => m.name === 'Darren_Game'),
            cloth = skinned.filter((m) => /scarf|Scarf/.test(m.name)),
            clothNear = new Map();
          if (body)
            for (const m of cloth) {
              const n = m.geometry.attributes.position.count,
                bn = body.geometry.attributes.position.count,
                near = new Int32Array(n),
                gap = new Float32Array(n);
              for (let i = 0; i < n; i++) {
                a.fromArray(m.userData.rest, i * 3);
                let best = 9,
                  bi = 0;
                for (let k = 0; k < bn; k++) {
                  b.fromArray(body.userData.rest, k * 3);
                  if (b.y > 0.99) continue; // the skin it rests on, not the chin hanging over it
                  const d = a.distanceToSquared(b);
                  if (d < best) ((best = d), (bi = k));
                }
                near[i] = bi;
                gap[i] = Math.sqrt(best);
              }
              clothNear.set(m, { near, gap });
            }
          // Drift: skin well inside one body part (much nearer that bone than any other) should
          // move rigidly with it. How far it strays from that, on average, says how rubbery the
          // limbs got; blending wider always lowers tears but raises drift.
          const own = [];
          if (body) {
            const bones = body.skeleton.bones,
              n = body.geometry.attributes.position.count;
            for (let i = 0; i < n; i++) {
              a.fromArray(body.userData.rest, i * 3).applyMatrix4(body.matrixWorld);
              const d = bones
                .map((bn, k) => [
                  BIND_SEGS[bn.name] && bn.name !== 'root' ? segDist(a, BIND_SEGS[bn.name]) : 9,
                  k,
                ])
                .sort((x, y) => x[0] - y[0]);
              if (d[0][0] < 0.6 * d[1][0] && !/wing/.test(bones[d[0][1]].name))
                own.push([i, d[0][1]]);
            }
          }
          const rigidOf = (i, k) => {
            const sk = body.skeleton;
            return a
              .fromBufferAttribute(body.geometry.attributes.position, i)
              .applyMatrix4(body.bindMatrix)
              .applyMatrix4(
                new THREE.Matrix4().multiplyMatrices(sk.bones[k].matrixWorld, sk.boneInverses[k])
              )
              .applyMatrix4(body.bindMatrixInverse);
          };
          let drift = 0,
            driftN = 0;
          const driftBy = {};
          let sunk = 0,
            lifted = 0;
          const clothBy = {};
          let tears = 0,
            strain = 0,
            worstVol = { lo: 1, hi: 1, loClip: '', hiClip: '' };
          for (const c of this.clips.filter((c) => !skip.includes(c.name))) {
            const e = (clips[c.name] = { tears: 0, strain: 0, peak: 0, peakT: 0, vol: [1, 1] });
            for (let s = 0; s < samples; s++) {
              const t = (c.dur * s) / samples;
              this.shot({ clip: c.name, t, mode: 'tex' });
              let frameTears = 0;
              for (const m of skinned) {
                const g = m.geometry,
                  n = g.attributes.position.count,
                  idx = g.index,
                  posed = new Float32Array(n * 3),
                  top = tops.get(m),
                  vw = vertWorst.get(m),
                  vc = vertClip.get(m);
                for (let i = 0; i < n; i++) posed.set(m.getVertexPosition(i, v).toArray(), i * 3);
                for (let t3 = 0; t3 < idx.count; t3 += 3)
                  for (let k = 0; k < 3; k++) {
                    const p = idx.getX(t3 + k),
                      q = idx.getX(t3 + ((k + 1) % 3));
                    if (p > q) continue; // each shared edge once
                    a.fromArray(m.userData.rest, p * 3);
                    b.fromArray(m.userData.rest, q * 3);
                    const rest = a.distanceTo(b);
                    if (rest < 0.006) continue;
                    a.fromArray(posed, p * 3);
                    b.fromArray(posed, q * 3);
                    const r = a.distanceTo(b) / rest,
                      l = Math.abs(Math.log(r));
                    for (const x of [p, q])
                      if (l > vw[x]) {
                        vw[x] = l;
                        vc[x] = c.name;
                      }
                    if (r > 1.3 || r < 0.77) {
                      e.strain++;
                      strain++;
                    }
                    if (r > 1.6 || r < 0.5) {
                      e.tears++;
                      tears++;
                      frameTears++;
                      const key = m.name + ':' + [top[p], top[q]].sort().join('/');
                      pairs[key] = (pairs[key] || 0) + 1;
                    }
                  }
                if (m.name === 'Darren_Game') {
                  const r = volume(m, posed) / restVol[m.name];
                  e.vol = [Math.min(e.vol[0], r), Math.max(e.vol[1], r)];
                  if (r < worstVol.lo) Object.assign(worstVol, { lo: r, loClip: c.name });
                  if (r > worstVol.hi) Object.assign(worstVol, { hi: r, hiClip: c.name });
                }
              }
              {
                const pv = new THREE.Vector3();
                for (const [i, k] of own) {
                  body.getVertexPosition(i, pv);
                  const dd = pv.distanceTo(rigidOf(i, k)),
                    e = (driftBy[body.skeleton.bones[k].name] ??= { sum: 0, n: 0 });
                  drift += dd;
                  driftN++;
                  e.sum += dd;
                  e.n++;
                }
              }
              for (const [m, { near, gap }] of clothNear) {
                const bp = new THREE.Vector3();
                for (let i = 0; i < near.length; i++) {
                  m.getVertexPosition(i, a);
                  body.getVertexPosition(near[i], bp);
                  const g = a.distanceTo(bp);
                  const pm = (clothBy[m.name] ??= { sunk: 0, lifted: 0 });
                  if (g < gap[i] * 0.4) (sunk++, pm.sunk++, (e.sunk = (e.sunk || 0) + 1));
                  else if (g > gap[i] + 0.04)
                    (lifted++, pm.lifted++, (e.lifted = (e.lifted || 0) + 1));
                }
              }
              if (frameTears > e.peak) Object.assign(e, { peak: frameTears, peakT: t });
            }
          }
          // Per-vertex worst stretch, summarised by the bone that mainly drives the vertex.
          const regions = {};
          for (const m of skinned) {
            const vw = vertWorst.get(m),
              top = tops.get(m);
            vw.forEach((l, i) => {
              const r = (regions[m.name + ':' + top[i]] ??= {
                verts: 0,
                torn: 0,
                strained: 0,
                clips: {},
              });
              r.verts++;
              if (l > Math.log(1.3)) r.strained++;
              if (l > Math.log(1.6)) {
                r.torn++;
                const cn = vertClip.get(m)[i];
                r.clips[cn] = (r.clips[cn] || 0) + 1;
              }
            });
          }
          return {
            statics,
            clips,
            pairs,
            regions,
            tears,
            strain,
            volume: worstVol,
            samples,
            scarf: { sunk, lifted, by: clothBy },
            drift: {
              cm: (100 * drift) / (driftN || 1),
              verts: own.length,
              by: Object.fromEntries(
                Object.entries(driftBy).map(([k, e]) => [k, (100 * e.sum) / e.n])
              ),
            },
          };
        },
        // Body parts pushed into other body parts (Claude update 12, tools/review/collide.cjs):
        // every clip sampled `samples` times, optionally with extra turns (the game's head look).
        // Each vertex of a probing part (wings, arms, legs, tail) is tested against the nearest
        // skin of the rest of the body: on its inside means it went through. Skin that was next to
        // it at rest (the same continuous skin) and anything already inside at rest is left out.
        // Also how far the feet sink below or float above the ground.
        kit() {
          if (this._kit !== undefined) return this._kit;
          const body = meshes.find((m) => m.name === 'Darren_Game');
          if (!body) return (this._kit = null);
          const g = body.geometry,
            n = g.attributes.position.count,
            j = g.attributes.skinIndex,
            w = g.attributes.skinWeight,
            idx = g.index,
            bones = body.skeleton.bones,
            R = body.userData.rest;
          const topBone = new Array(n);
          for (let i = 0; i < n; i++) {
            let bi = 0;
            for (let k = 1; k < 4; k++) if (w.getComponent(i, k) > w.getComponent(i, bi)) bi = k;
            topBone[i] = bones[j.getComponent(i, bi)].name;
          }
          const part = (b) =>
            /^wing/.test(b)
              ? 'wing_' + b.slice(-1)
              : /^(arm|hand)_/.test(b)
                ? 'arm_' + b.slice(-1)
                : /^(leg|shin|foot)_/.test(b)
                  ? 'leg_' + b.slice(-1)
                  : /^tail_[2-5]/.test(b)
                    ? 'tail'
                    : b === 'head'
                      ? 'head'
                      : 'trunk';
          // The face (eyes, cheeks, snout, brows) is told apart from the rest of the head.
          const parts = topBone.map((b, i) =>
            b === 'head' && R[i * 3 + 2] > 0.12 && R[i * 3 + 1] > 1.15 ? 'face' : part(b)
          );
          // Connected shells (welded at texture seams): the body, each wing, the eyes and brows.
          const shell = (() => {
            const keys = new Map(),
              weld = new Int32Array(n);
            for (let i = 0; i < n; i++) {
              const k = [0, 1, 2].map((q) => Math.round(R[i * 3 + q] * 2000)).join();
              if (!keys.has(k)) keys.set(k, keys.size);
              weld[i] = keys.get(k);
            }
            const par = [...Array(keys.size).keys()],
              find = (x) => (par[x] === x ? x : (par[x] = find(par[x])));
            for (let t = 0; t < idx.count; t += 3) {
              par[find(weld[idx.getX(t)])] = find(weld[idx.getX(t + 1)]);
              par[find(weld[idx.getX(t + 1)])] = find(weld[idx.getX(t + 2)]);
            }
            return Array.from(weld, (x) => find(x));
          })();
          const probing = (p) => p !== 'head' && p !== 'face' && p !== 'trunk';
          const P = new Float32Array(n * 3),
            N = new Float32Array(n * 3),
            v = new THREE.Vector3(),
            a = new THREE.Vector3(),
            b = new THREE.Vector3(),
            c = new THREE.Vector3();
          const pose = () => {
            for (let i = 0; i < n; i++) P.set(body.getVertexPosition(i, v).toArray(), i * 3);
            N.fill(0);
            for (let t = 0; t < idx.count; t += 3) {
              const p = idx.getX(t),
                q = idx.getX(t + 1),
                r = idx.getX(t + 2);
              a.fromArray(P, q * 3).sub(v.fromArray(P, p * 3));
              b.fromArray(P, r * 3).sub(v);
              c.crossVectors(a, b);
              for (const x of [p, q, r])
                for (let k = 0; k < 3; k++) N[x * 3 + k] += c.getComponent(k);
            }
          };
          const CELL = 0.05,
            NEAR = 0.12;
          const inside = () => {
            const grid = new Map();
            for (let i = 0; i < n; i++) {
              const k =
                Math.floor(P[i * 3] / CELL) +
                ',' +
                Math.floor(P[i * 3 + 1] / CELL) +
                ',' +
                Math.floor(P[i * 3 + 2] / CELL);
              (grid.get(k) || grid.set(k, []).get(k)).push(i);
            }
            const out = new Map();
            for (let i = 0; i < n; i++) {
              if (!probing(parts[i])) continue;
              const x = P[i * 3],
                y = P[i * 3 + 1],
                z = P[i * 3 + 2];
              let best = 0.1 ** 2,
                bi = -1;
              const cx = Math.floor(x / CELL),
                cy = Math.floor(y / CELL),
                cz = Math.floor(z / CELL);
              for (let dx = -1; dx <= 1; dx++)
                for (let dy = -1; dy <= 1; dy++)
                  for (let dz = -1; dz <= 1; dz++)
                    for (const o of grid.get(cx + dx + ',' + (cy + dy) + ',' + (cz + dz)) || []) {
                      if (parts[o] === parts[i]) continue;
                      // The same continuous skin at rest (a shoulder running into the chest).
                      if (
                        shell[o] === shell[i] &&
                        (R[o * 3] - R[i * 3]) ** 2 +
                          (R[o * 3 + 1] - R[i * 3 + 1]) ** 2 +
                          (R[o * 3 + 2] - R[i * 3 + 2]) ** 2 <
                          NEAR * NEAR
                      )
                        continue;
                      const d =
                        (P[o * 3] - x) ** 2 + (P[o * 3 + 1] - y) ** 2 + (P[o * 3 + 2] - z) ** 2;
                      if (d < best) ((best = d), (bi = o));
                    }
              if (bi < 0) continue;
              const dot =
                (x - P[bi * 3]) * N[bi * 3] +
                (y - P[bi * 3 + 1]) * N[bi * 3 + 1] +
                (z - P[bi * 3 + 2]) * N[bi * 3 + 2];
              if (dot < 0) out.set(i, bi);
            }
            return out;
          };
          const pose0 = { bind: true };
          this.shot(pose0);
          pose();
          const atRest = inside();
          return (this._kit = { body, n, parts, topBone, P, pose, inside, atRest });
        },
        // Vertices of the current pose that went through another body part (not at rest).
        through() {
          const k = this.kit();
          if (!k) return new Map();
          k.pose();
          const out = k.inside();
          for (const i of k.atRest.keys()) out.delete(i);
          return out;
        },
        collide({ samples = 12, skip = [], turn = null, clips = null } = {}) {
          const K = this.kit();
          if (!K) return null;
          const { n, parts, topBone, P } = K;
          const res = { clips: {}, total: 0, pairs: {}, verts: {}, ground: {}, under: {} };
          const seen = {};
          const list = this.clips.filter(
            (c) => !skip.includes(c.name) && (!clips || clips.includes(c.name))
          );
          for (const cl of list) {
            const e = (res.clips[cl.name] = { inside: 0, peak: 0, peakT: 0, pairs: {} });
            let lo = 9;
            for (let s = 0; s < samples; s++) {
              const t = (cl.dur * s) / samples;
              this.shot({ clip: cl.name, t, mode: 'tex', turn });
              let f = 0;
              for (const [i, bi] of this.through()) {
                f++;
                const k = parts[i] + ' > ' + parts[bi];
                (seen[k] ??= new Set()).add(i);
                res.pairs[k] = (res.pairs[k] || 0) + 1;
                e.pairs[k] = (e.pairs[k] || 0) + 1;
              }
              e.inside += f;
              res.total += f;
              if (f > e.peak) Object.assign(e, { peak: f, peakT: t });
              // Lowest foot skin this frame (the clips keep the hero's root on the ground), and
              // the lowest point of every other part (a tail or paw dug into the snow). Frames in
              // the air are left out: the game lifts the whole hero there.
              if (inAir(cl.name, t)) continue;
              let fl = 9;
              for (let i = 0; i < n; i++) {
                const y = P[i * 3 + 1];
                if (/^foot_/.test(topBone[i])) fl = Math.min(fl, y);
                else {
                  const gp = (res.under[cl.name] ??= {});
                  if (y < (gp[parts[i]] ?? 0)) gp[parts[i]] = y;
                }
              }
              lo = Math.min(lo, fl);
            }
            res.ground[cl.name] = lo;
          }
          for (const [k, s] of Object.entries(seen)) res.verts[k] = s.size;
          return res;
        },
        // opts: { clip, t, yaw (deg), pitch (deg), mode: tex|clay|wire|weights|stretch|skeleton, bone, dist, h, follow,
        //         target: [x, z] to look at instead of the middle, bind: true for the unposed model }
        shot(o = {}) {
          const mode = o.mode || 'tex';
          restoreColors();
          for (const m of meshes)
            m.material =
              mode === 'clay' || mode === 'through'
                ? clay
                : mode === 'wire'
                  ? wire
                  : mode === 'weights'
                    ? weightMaterial(m, o.bone)
                    : mode === 'owners'
                      ? ownersMaterial(m)
                      : mode === 'stray'
                        ? strayMaterial(m, o.far)
                        : mode === 'stretch'
                          ? stretchMaterial(m)
                          : mode === 'albedo' || mode === 'metal'
                            ? flatMaterial(m, mode)
                            : m.userData.mat;
          skel.visible = mode === 'skeleton';
          if (mode === 'skeleton')
            for (const m of meshes) {
              m.material = clay;
            }
          animator.entries = [];
          animator.current = null;
          animator.update(0, {
            key: 'k' + Math.random(),
            clip: o.clip || 'Idle',
            time: o.t || 0,
            blend: 0.001,
            speed: 0,
            yaw: 0,
            x: 0,
            y: 0,
            z: 0,
            // In the air (jumps, hopping moves) the game plants nothing on the ground.
            air: inAir(o.clip || '', o.t || 0),
          });
          animator.update(0.001, {
            key: animator.current,
            clip: o.clip || 'Idle',
            time: o.t || 0,
            speed: 0,
            yaw: 0,
            x: 0,
            y: 0,
            z: 0,
            // In the air (jumps, hopping moves) the game plants nothing on the ground.
            air: inAir(o.clip || '', o.t || 0),
          });
          // A raw pose on top of the hero's base stance (for checking pose directions).
          if (o.pose) applyPose(rig, mix(LIBRARY[name].base, o.pose));
          // Extra turns on top, the way the game's procedural layer adds them (anim.mjs turn():
          // radians about character axes), e.g. { head: [0, 0.65, 0] } = the head looking left
          // as far as the game ever turns it (Claude update 12).
          if (o.turn)
            for (const [role, [x, y, z]] of Object.entries(o.turn))
              animator.turn(rig.role[role] || root.getObjectByName(role), x, y, z);
          // The game keeps wings and paws out of the head after everything else (anim.mjs).
          if ((o.turn || o.pose) && !o.noClear) keepClear(rig);
          // The model exactly as built, before any animation (bind pose).
          if (o.bind)
            for (const b of rig.bones) {
              const i = rig.info.get(b);
              b.quaternion.copy(i.restQ);
              b.position.copy(i.restP);
            }
          root.updateMatrixWorld(true);
          for (const m of meshes)
            if (m.userData.needsStretch && mode === 'stretch') paintStretch(m);
          // 'through': clay, with skin that went through another body part in red and the skin
          // it went into in blue (Claude update 12).
          if (mode === 'through') {
            const k = this.kit(),
              col = new Float32Array(k.n * 3).fill(0.78);
            for (const [i, bi] of this.through()) {
              col.set([0.95, 0.1, 0.1], i * 3);
              col.set([0.15, 0.3, 0.95], bi * 3);
            }
            setDebugColors(k.body.geometry, col);
            k.body.material = this._thru ??= new THREE.MeshLambertMaterial({ vertexColors: true });
          }
          const yaw = ((o.yaw ?? 25) * Math.PI) / 180,
            pitch = ((o.pitch ?? 12) * Math.PI) / 180;
          const d = o.dist ?? 4.2,
            h = o.h ?? 0.75;
          let [tx, tz] = o.target || [0, 0];
          // follow: aim at the hips wherever the clip has moved or rolled the body.
          let hh = h;
          if (o.follow) {
            const p = rig.bones.find((b) => b.name === (o.follow === true ? 'hips' : o.follow));
            const w = p.getWorldPosition(new THREE.Vector3());
            [tx, tz, hh] = [w.x, w.z, w.y + (o.h ?? 0.75) - 0.48];
          }
          camera.position.set(
            tx + Math.sin(yaw) * Math.cos(pitch) * d,
            hh + Math.sin(pitch) * d,
            tz + Math.cos(yaw) * Math.cos(pitch) * d
          );
          camera.lookAt(tx, hh, tz);
          renderer.render(scene, camera);
          return true;
        },
      };
      // Rest positions as the game shows them (bind pose through the skin, so packed/quantized
      // vertex data compares like for like), for the stretch views.
      review.shot({ bind: true });
      root.updateMatrixWorld(true);
      BIND_SEGS = boneSegments();
      for (const m of meshes) {
        const pos = m.geometry.attributes.position,
          v = new THREE.Vector3();
        m.userData.rest = new Float32Array(pos.count * 3);
        for (let i = 0; i < pos.count; i++)
          m.userData.rest.set(m.getVertexPosition(i, v).toArray(), i * 3);
      }
      // For one-off probes from tools (page.evaluate).
      review.meshes = meshes;
      review.kit();
      review.rig = rig;
      review.THREE = THREE;
      window.reviewReady = true;
    </script>
  </body>
